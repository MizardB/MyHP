[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myhp"
version = "0.1.0"
description = "Python tool and library for communication with HP Prime graphing calculators"
readme = "README.md"
authors = [{ name = "HP Prime Community" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
myhp = "myhp.cli:main"

[tool.setuptools.package-data]
myhp = [
    "data/app_templates/*",
    "data/gallery_templates/*",
]
